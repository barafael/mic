[package]
name = "xtask"
description = "The test box's commands, run as `cargo testbox`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display", "error"] }
mic-core = { version = "0.1.0", path = "../crates/mic-core" }
mic-harness = { version = "0.1.0", path = "../crates/mic-harness" }
png = "0.18"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
