[package]
name = "testbox-web"
description = "The box's displays as a web page on loopback (`cargo testbox web`)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
testbox-view.workspace = true
testbox-vnc.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
getrandom = "0.4.3"
hex = "0.4"
