[package]
name = "testbox-vnc"
description = "A box display's VNC client, shared by shot, viewer and web."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
testbox-view.workspace = true
vnc-rs = "0.6"
tokio = { workspace = true, features = ["net", "time", "sync", "macros"] }
landlock = "0.4.7"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "io-util", "macros", "time"] }
