[package]
name = "box-camera"
description = "The test box's camera: a PipeWire camera showing a client's pattern, for the video phase's real-camera check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mic-media = { version = "0.1.0", path = "../../crates/mic-media" }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_34"] }
