# The box's audio devices (testbox/client/client-session starts PipeWire with them), both mono at
# 48 kHz, as mic sends and plays, and the defaults by their priority:
#
# - the speaker: a sink, whose output a check records from its monitor;
# - the microphone: a source fed by a sink of its own, `microphone-in`, which a check plays into.
#   (A virtual source can't be played into: WirePlumber links playback only to sinks.) Its sink is
#   never the default speaker: its priority is low.
# - a headset's microphone, likewise fed by `headset-in`: a second microphone, never the default,
#   for a check that one chosen in the settings is what's sent.
context.objects = [
    {   factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "speaker"
            node.description = "The box's speaker"
            media.class = Audio/Sink
            audio.position = [ MONO ]
            audio.rate = 48000
            priority.session = 2000
            priority.driver = 2000
        }
    }
]
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "The box's microphone"
            audio.position = [ MONO ]
            capture.props = {
                node.name = "microphone-in"
                media.class = Audio/Sink
                priority.session = 100
            }
            playback.props = {
                node.name = "microphone"
                media.class = Audio/Source
                priority.session = 2000
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "The box's headset"
            audio.position = [ MONO ]
            capture.props = {
                node.name = "headset-in"
                media.class = Audio/Sink
                priority.session = 50
            }
            playback.props = {
                node.name = "headset"
                media.class = Audio/Source
                priority.session = 1000
            }
        }
    }
]
