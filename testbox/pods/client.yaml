# A participant, @NAME@, in a pod of its own: all containers of a pod share a network namespace,
# so shaping one participant's network takes a pod of its own. `cargo testbox up` plays one per
# client from this file, filling in its name, its voice and the image placeholders.
{
  apiVersion: "v1",
  kind: "Pod",
  metadata: {
    name: "mic-testbox-@NAME@",
  },
  spec: {
    restartPolicy: "Always",
    # The profiler sees the window's processes.
    shareProcessNamespace: true,
    containers: [
      # The window (crates/mic-slint) on a display of its own (testbox/view/with-display), served
      # on a socket in target/testbox-view/@NAME@ for `cargo testbox vnc` and `shot`, with the
      # host's GPU. Driven by its harness, on a socket in target/testbox-run/@NAME@; its device
      # secret in GNOME Keyring (client-session), under a home in that directory too, which
      # outlives the container. It trusts the relay by the box's CA.
      {
        name: "client",
        image: "@IMAGE:client@",
        args: [
          "/opt/mic/with-display", "/run/view/vnc", "1280x720", "--",
          "client-session",
          "/opt/mic/mic",
          "--relay", "https://mic-testbox-relay:4443/",
          "--ca", "/keys/ca.pem",
          "--harness", "/run/mic/@NAME@",
          # The version check, against the box's site, which announces a newer one.
          "--version-url", "http://mic-testbox-site:8080/version.json",
          # Recordings in the client's own directory, where a check reads them back.
          "--recordings", "/run/mic/recordings",
          # Its voice: a tone of its own and an analyzer for a speaker (xtask's `podman::tone`),
          # or the box's PipeWire devices.
          @VOICE@
        ],
        env: [
          # Plain logs: the record merges them into one timeline.
          { name: "RUST_LOG", value: "info,moq_sock::bind=error" },
          { name: "NO_COLOR", value: "1" },
          { name: "HOME", value: "/run/mic/home" },
          # Vulkan's loader, Mesa and the keyring want a runtime directory.
          { name: "XDG_RUNTIME_DIR", value: "/tmp" },
          # Slint presents with Fifo, which waits for a vertical blank Xvnc never has: under
          # 2 fps (spikes/video-tiles). Mesa presents in mailbox mode instead.
          { name: "MESA_VK_WSI_PRESENT_MODE", value: "mailbox" },
        ],
        securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } },
        volumeMounts: [
          { name: "bin", mountPath: "/opt/mic", readOnly: true },
          { name: "keys", mountPath: "/keys", readOnly: true },
          { name: "run", mountPath: "/run/mic" },
          { name: "view", mountPath: "/run/view" },
          # The host's GPU, for rendering and video only: the render node, not the card's
          # node. Left out with `up --no-gpu`, where Slint draws in software.
          # @GPU@ { name: "render", mountPath: "/dev/dri/renderD128" },
        ],
      },
      # Shapes the pod's network, which its containers share: netem's loss and delay, and nft's
      # dropped UDP, as the `network` phase sets them with `podman exec`. NET_ADMIN over the
      # pod's own network namespace only, which rootless Podman's user namespace owns; netem's
      # module loads on the host when first asked for. Idles otherwise.
      {
        name: "shaper",
        image: "@IMAGE:moq@",
        args: ["bash", "-c", "trap 'exit 0' TERM; sleep infinity & wait"],
        securityContext: {
          allowPrivilegeEscalation: false,
          capabilities: { drop: ["ALL"], add: ["NET_ADMIN"] },
        },
      },
      # perf, attaching to the window's mic (`cargo testbox drive <client> profile`), from a
      # container of its own: the window's keyring daemon aborts with capabilities it can't drop.
      # Podman's seccomp lets perf_event_open through with CAP_PERFMON, and attaching to a
      # process it didn't start takes CAP_SYS_PTRACE, with the host's Yama at 1; both in the
      # pod's user namespace only, and the host's perf_event_paranoid keeps perf to user space.
      # The binaries mounted as the window has them, for perf's symbols. Idles otherwise.
      {
        name: "profiler",
        image: "@IMAGE:client@",
        args: ["bash", "-c", "trap 'exit 0' TERM; sleep infinity & wait"],
        securityContext: {
          allowPrivilegeEscalation: false,
          capabilities: { drop: ["ALL"], add: ["PERFMON", "SYS_PTRACE"] },
        },
        volumeMounts: [{ name: "bin", mountPath: "/opt/mic", readOnly: true }],
      },
    ],
    volumes: [
      # What the builder built (`cargo testbox build`): a change is a restart, not an image build.
      { name: "bin", hostPath: { path: "@REPO@/target/testbox-bin", type: "Directory" } },
      { name: "keys", persistentVolumeClaim: { claimName: "mic-testbox-keys" } },
      # The harness's socket and the keyring's home, which only this client mounts: no client
      # reaches another's.
      { name: "run", hostPath: { path: "@REPO@/target/testbox-run/@NAME@", type: "Directory" } },
      { name: "view", hostPath: { path: "@REPO@/target/testbox-view/@NAME@", type: "Directory" } },
      # @GPU@ { name: "render", hostPath: { path: "/dev/dri/renderD128", type: "CharDevice" } },
    ],
  },
}
