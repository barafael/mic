# The checks' tools, inside the box's network, for `podman kube play`. KYAML style: flow
# mappings, quoted strings. `cargo testbox up` fills in each image placeholder with the image's
# content-hashed tag, and plays the pod on the internal network mic-testbox.
{
  apiVersion: "v1",
  kind: "Pod",
  metadata: {
    name: "mic-testbox-tools",
  },
  spec: {
    restartPolicy: "Always",
    containers: [
      # Idles; the checks run their probes in it with `podman exec`. As PID 1, `sleep` would
      # ignore the TERM that stops it, and every `up` and `down` would wait out podman's timeout.
      {
        name: "tools",
        image: "@IMAGE:tools@",
        args: ["bash", "-c", "trap 'exit 0' TERM; sleep infinity & wait"],
        securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } },
      },
    ],
  },
}
