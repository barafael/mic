[graph]
all-features = true

[advisories]
# Direct dependencies only; `cargo audit` still lists transitive ones.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # The Marvin attack on rsa's private-key operations (no fixed release). rsa reaches mic only
    # through moq-auth in the embedded test relay (mic-testrelay), which uses it to verify RS256
    # tokens: public-key operations, which the attack isn't about. Revisit if mic itself ever
    # signs or decrypts with RSA.
    { id = "RUSTSEC-2023-0071", reason = "only RSA verification, in the test relay's auth" },
]

[licenses]
# mic is MIT OR Apache-2.0 (D24), so only permissive licenses, and Slint's royalty-free one: Slint
# is GPL-3.0-only OR royalty-free OR commercial, and mic takes the royalty-free terms, whose
# condition the About screen meets with AboutSlint (design §5.10).
#
# MPL-2.0 for one crate only, libvpx's binding (libvpx-native-sys): MPL is copyleft per file, so
# its files stay MPL and mic's stay MIT OR Apache-2.0. libvpx itself is BSD-3-Clause.
exceptions = [
    { allow = ["MPL-2.0"], crate = "libvpx-native-sys" },
]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots and webpki-root-certs: Mozilla's root certificates, as data.
    "CDLA-Permissive-2.0",
    "ISC",
    "LicenseRef-Slint-Royalty-free-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
