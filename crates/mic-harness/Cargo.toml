[package]
name = "mic-harness"
description = "The test box's harness: a protocol over a Unix socket, and a server any frontend embeds"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mic-core = { version = "0.1.0", path = "../mic-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
mic-testrelay = { path = "../mic-testrelay" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
