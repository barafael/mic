[package]
name = "mic-media"
description = "mic's media: audio and video sources and sinks, devices and synthetic, and their codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The system's microphone and speaker, through cpal, and echo cancellation between them. Off for what only uses synthetic ones (the box's crowd, tests), so they don't need the
# platform's audio libraries.
devices = ["dep:cpal"]
# VP9 through libvpx, which it links: the system's, found by pkg-config (VPX_STATIC=1 links it
# statically).
vp9 = ["dep:vpx-sys"]
# Screens and windows captured, for screenshare, through moq-video's capture: X11 on Linux, or on
# Wayland the desktop's portal and PipeWire (which it links: the system's libpipewire, its bindings
# made by libclang); ScreenCaptureKit on macOS, Windows.Graphics.Capture on Windows.
screen = ["dep:moq-video", "moq-video/pipewire", "dep:ashpd", "tokio/rt-multi-thread"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
derive_more = { version = "2.1.1", features = ["display", "error"] }
moq-video = { version = "=0.1.16", default-features = false, features = ["capture"], optional = true }
ringbuf = "0.5.1"
nnnoiseless = { version = "0.5.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sonora = "0.2.0"
tokio = { version = "1.54.1", features = ["time", "sync"] }
tracing = "0.1.44"
vpx-sys = { package = "libvpx-native-sys", version = "5.0.17", optional = true }

# The portal's registry, so that a share's asking names mic (the same ashpd, and so the same
# D-Bus connection, as moq-video's).
[target.'cfg(target_os = "linux")'.dependencies]
# PipeWire's own devices, each by name, where PipeWire runs (cpal's default host then), rather than
# ALSA's few; ALSA where it doesn't.
cpal = { version = "0.18.2", optional = true, features = ["pipewire"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
