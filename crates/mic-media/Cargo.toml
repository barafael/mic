[package]
name = "mic-media"
description = "mic's media: audio and video sources and sinks, devices and synthetic, and their codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The system's microphone and speaker, through cpal, and echo cancellation between them (sonora).
# Off for what only uses synthetic ones (the box's crowd, tests), so they don't need the
# platform's audio libraries.
devices = ["dep:cpal", "dep:sonora"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
derive_more = { version = "2.1.1", features = ["display", "error"] }
ringbuf = "0.5.1"
sonora = { version = "0.2.0", optional = true }
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
