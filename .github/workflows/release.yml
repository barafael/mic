name: Release

# A tag v<version> makes a draft release of that version: Linux's AppImage and tarball, macOS's
# dmg, Windows's zip (packaging/), each built and uploaded by its platform's job, and the
# changelog's section for its notes. A person publishes the draft. Run by hand, it's a dry run:
# the same packages, kept as the run's artifacts, and no release, so they're tried before a tag
# that would have to move.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The tag names the version the packages say they are, and the changelog has its section.
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mic-slint"))')
          test "$TAG" = "v$version" || { echo "tag $TAG, but mic is $version"; exit 1; }
          awk -v section="## $version" '$0 == section { found = 1; next } /^## / && found { exit } found' \
            CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section $version"; exit 1; }
          gh release create "$TAG" --draft --verify-tag --title "mic $version" --notes-file notes.md

  package:
    needs: draft
    # A dry run has no draft to wait for.
    if: always() && (needs.draft.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # As CI's: Slint's, cpal's and PipeWire's headers on Linux, and libvpx everywhere, linked
      # statically.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libasound2-dev libvpx-dev libpipewire-0.3-dev
          echo "VPX_STATIC=1" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: |
          brew install libvpx pkg-config librsvg
          echo "VPX_STATIC=1" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install libvpx:x64-windows-static-md
          root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
          echo "VPX_LIB_DIR=$root/lib" >> "$GITHUB_ENV"
          echo "VPX_INCLUDE_DIR=$root/include" >> "$GITHUB_ENV"
          echo "VPX_VERSION=$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' "$VCPKG_INSTALLATION_ROOT/ports/libvpx/vcpkg.json" | head -1)" >> "$GITHUB_ENV"
          echo "VPX_STATIC=1" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: |
          packaging/appimage-tools.sh "$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: packaging/linux.sh dist
      - if: runner.os == 'macOS'
        run: packaging/macos.sh dist
      - if: runner.os == 'Windows'
        shell: bash
        run: packaging/windows.sh dist
      - shell: bash
        run: rm -rf dist/AppDir
      # Each package starts as a person would start it, from what they'd unpack: the AppImage
      # extracted (the runner has no FUSE), the app out of the dmg, mic.exe out of the zip.
      - if: runner.os == 'Linux'
        run: |
          ./dist/mic-*.AppImage --appimage-extract-and-run --version
          mkdir -p "$RUNNER_TEMP/tar" && tar xzf dist/mic-*.tar.gz -C "$RUNNER_TEMP/tar"
          "$RUNNER_TEMP"/tar/mic-*/mic --version
      - if: runner.os == 'macOS'
        run: |
          mount=$(hdiutil attach -nobrowse -readonly dist/mic-*.dmg | awk -F'\t' '/\/Volumes\// { print $NF }')
          "$mount/mic.app/Contents/MacOS/mic" --version
          hdiutil detach "$mount"
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zip" && 7z x -o"$RUNNER_TEMP/zip" dist/mic-*.zip >/dev/null
          "$RUNNER_TEMP"/zip/mic-*/mic.exe --version
      - if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mic-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
