name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # rustup on the runners installs the toolchain rust-toolchain.toml pins, with its components.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # What mic links against: on Linux, Slint's window and cpal's ALSA; everywhere, libvpx
      # (pkg-config finds it; on Windows, vcpkg's, by VPX_LIB_DIR) (unverified on Windows and
      # macOS until CI runs).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libasound2-dev libvpx-dev mesa-vulkan-drivers
      - if: runner.os == 'macOS'
        run: brew install libvpx pkg-config
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install libvpx:x64-windows-static-md
          root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
          echo "VPX_LIB_DIR=$root/lib" >> "$GITHUB_ENV"
          echo "VPX_INCLUDE_DIR=$root/include" >> "$GITHUB_ENV"
          echo "VPX_VERSION=$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' "$VCPKG_INSTALLATION_ROOT/ports/libvpx/vcpkg.json" | head -1)" >> "$GITHUB_ENV"
          echo "VPX_STATIC=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      # Every feature: the window's harness too.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The system keyring's tests run too (MIC_TEST_KEYRING): Keychain and Credential Manager
      # are there on the runners; on Linux, GNOME Keyring in a D-Bus session of its own, unlocked
      # with a password, which makes its default collection.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus
      # On Linux, mic-render's offscreen test must find an adapter: lavapipe (mesa-vulkan-drivers).
      - if: runner.os == 'Linux'
        env:
          MIC_TEST_KEYRING: "1"
          MIC_TEST_GPU: "1"
        run: |
          dbus-run-session -- bash -c \
            'echo ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --workspace --all-features --locked'
      - if: runner.os != 'Linux'
        env:
          MIC_TEST_KEYRING: "1"
        run: cargo test --workspace --all-features --locked

  # A release build of the `mic` binary on each platform, and that it runs (PLAN.md, commit 24):
  # each native dependency is built on Windows and macOS when it arrives, not first at release.
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # As the check job: Slint's and cpal's headers on Linux, libvpx everywhere.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libasound2-dev libvpx-dev
      - if: runner.os == 'macOS'
        run: brew install libvpx pkg-config
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install libvpx:x64-windows-static-md
          root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
          echo "VPX_LIB_DIR=$root/lib" >> "$GITHUB_ENV"
          echo "VPX_INCLUDE_DIR=$root/include" >> "$GITHUB_ENV"
          echo "VPX_VERSION=$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' "$VCPKG_INSTALLATION_ROOT/ports/libvpx/vcpkg.json" | head -1)" >> "$GITHUB_ENV"
          echo "VPX_STATIC=1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p mic-slint
      # Git Bash on Windows finds mic.exe by this name too.
      - shell: bash
        run: ./target/release/mic --version

  # The box's display tooling, a workspace of its own: Linux only (Unix sockets, Landlock).
  testbox-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: testbox/view
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # What the viewer's Slint window links against.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: testbox/view
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The video-tile spike (PLAN.md, commit 22), outside the workspace: it builds until it's
  # deleted.
  spikes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: spikes/video-tiles
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Slint's window, and the VA-API bindings' headers and bindgen.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libva-dev libclang-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/video-tiles
      - run: cargo fmt -- --check
      - run: cargo check --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@e639db99335bc9038abc0e066dfcd72e23d26fb4 # v0.3.0
        with:
          advanced-security: false
