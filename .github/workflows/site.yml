name: Site

# The site (D25): the landing page, the invite page and version.json, built from site/ and
# published to GitHub Pages whenever main changes them or the version.
on:
  push:
    branches: [main]
    paths: ["site/**", "Cargo.toml", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: node --test site/
      - run: site/build.sh _site
      # Pinned by commit; the SHAs were read from GitHub's API (2026-10-27) and are confirmed by
      # the first run (docs/observations.md).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
