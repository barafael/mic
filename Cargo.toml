[workspace]
# Members are listed explicitly: a glob such as "crates/*" fails while it matches nothing.
members = ["xtask"]
resolver = "3"
# Spikes are measurements, not part of the app (PLAN.md, M4).
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
